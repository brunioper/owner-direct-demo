services:
  - type: web
    name: owner-direct-demo
    runtime: node
    plan: free
    buildCommand: ""
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: google/gemma-4-31b-it:free
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: OPENROUTER_FALLBACK_MODELS
        value: ""
      - key: AI_ROUTING_STORAGE
        value: db
      - key: SUPABASE_TABLE
        value: properties
      - key: SUPABASE_PROFILE_TABLE
        value: profiles
      - key: SUPABASE_AI_SETTINGS_TABLE
        value: ai_settings
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
